name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: test-env
          init-shell: cmd.exe
          create-args: >-
            python
            numpy
            libblas=*=*openblas
            liblapacke=*=*openblas
            llvm-tools
            pip

      - name: micromamba info (cmd.exe)
        shell: cmd /C CALL {0}
        run: micromamba info

      - name: install pkg
        shell: cmd /C CALL {0}
        run: |
          pip install . -vv

      - name: create DLL
        shell: cmd /C CALL {0}
        run: |
          del /Q "%CONDA_PREFIX%\\Library\\bin\\libblas.dll"
          del /Q "%CONDA_PREFIX%\\Library\\bin\\libcblas.dll"
          del /Q "%CONDA_PREFIX%\\Library\\bin\\liblapack.dll"
          del /Q "%CONDA_PREFIX%\\Library\\bin\\liblapacke.dll"
          copy "%CONDA_PREFIX%\\Library\\bin\\openblas.dll" "%CONDA_PREFIX%\\Library\\bin\\openblas.0.dll"
          create-forwarder-dll.exe "%CONDA_PREFIX%\\Library\\bin\\openblas.0.dll" "%CONDA_PREFIX%\\Library\\bin\\libblas.dll" "%CONDA_PREFIX%\\Library\\lib\\libblas_forwarder.lib" --no-temp-dir
          if not exist "%CONDA_PREFIX%\\Library\\lib\\libblas_forwarder.lib" exit 1
          create-forwarder-dll.exe "%CONDA_PREFIX%\\Library\\bin\\openblas.0.dll" "%RUNNER_TEMP%\\libblas.dll" "%RUNNER_TEMP%\\libblas.dll.a" --no-temp-dir
          llvm-nm "%RUNNER_TEMP%\\libblas.dll.a" | findstr /C:"__imp_cblas_dgemm" || exit 1
          copy "%CONDA_PREFIX%\\Library\\bin\\libblas.dll" "%CONDA_PREFIX%\\Library\\bin\\libcblas.dll"
          copy "%CONDA_PREFIX%\\Library\\bin\\libblas.dll" "%CONDA_PREFIX%\\Library\\bin\\liblapack.dll"
          copy "%CONDA_PREFIX%\\Library\\bin\\libblas.dll" "%CONDA_PREFIX%\\Library\\bin\\liblapacke.dll"

      - name: run test
        shell: cmd /C CALL {0}
        run: >-
          python -c "import numpy"

  openmp-ordinals:
    # https://github.com/conda-forge/openmp-feedstock/issues/236
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: test-env
          init-shell: cmd.exe
          create-args: >-
            python
            llvm-openmp
            pip

      - name: install pkg
        shell: cmd /C CALL {0}
        run: |
          pip install . -vv

      - name: create libiomp5md.dll forwarder
        shell: cmd /C CALL {0}
        run: |
          mkdir "%RUNNER_TEMP%\\openmp"
          create-forwarder-dll.exe "%CONDA_PREFIX%\\Library\\bin\\libomp.dll" "%RUNNER_TEMP%\\openmp\\libiomp5md.dll"

      - name: check ordinals
        shell: cmd /C CALL {0}
        run: >-
          python tests\\check_ordinals.py "%CONDA_PREFIX%\\Library\\bin\\libomp.dll" "%RUNNER_TEMP%\\openmp\\libiomp5md.dll"
